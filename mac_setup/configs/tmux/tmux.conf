# =============================================================================
# tmux.conf - managed by mac_setup
# =============================================================================

# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---------------------------------------------------------------------------
# Splits & windows
# ---------------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "Config reloaded"
unbind '"'
unbind %

# Pane switching with Alt-Arrow (no prefix)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Move window (tab) left/right with prefix + Shift-Arrow
bind S-Left  swap-window -t -1\; select-window -t -1
bind S-Right swap-window -t +1\; select-window -t +1

# ---------------------------------------------------------------------------
# Core settings
# ---------------------------------------------------------------------------
set -g mouse on
set -g base-index 0
set -g pane-base-index 0
set -g history-limit 50000
set -sg escape-time 0
set -g monitor-activity on
set -g visual-activity off
set -g monitor-bell on
set -g visual-bell off
set -g bell-action other
# Clear the agent indicator when you navigate to a window or pane — you have now
# seen it. pane-focus-in is dead in tmux 3.6+; after-select-* are the correct hooks.
#
# These go through `meldr claude-hook clear` rather than unsetting @cc_status
# directly, because the tab is an aggregate of its panes: blanket-clearing the
# window when you merely move between panes would hide a sibling agent that is
# still waiting on you. `clear` drops the pane you looked at and recomputes the
# tab from whatever is left.
#
# Absolute path: the tmux server's PATH is whatever it inherited when it started
# and generally does not include ~/.cargo/bin, so a bare `meldr` fails silently.
set-hook -g after-select-pane   'run-shell -b "$HOME/.cargo/bin/meldr claude-hook clear --pane #{pane_id} --now"'
set-hook -g after-select-window 'run-shell -b "$HOME/.cargo/bin/meldr claude-hook clear --window #{window_id} --all-panes --now"'

# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# ---------------------------------------------------------------------------
# Tokyo Night theme (manual — matches nvim tokyonight-night)
# ---------------------------------------------------------------------------
# Palette
TN_BG="#1a1b26"
TN_FG="#c0caf5"
TN_BLACK="#15161e"
TN_BLUE="#7aa2f7"
TN_CYAN="#7dcfff"
TN_GREEN="#9ece6a"
TN_GREY="#414868"
TN_DARK="#24283b"

set -g status-style "bg=${TN_BG},fg=${TN_FG}"
set -g status-left "#[bg=${TN_BLUE},fg=${TN_BLACK},bold]  #S #[bg=${TN_BG}] "
set -g status-left-length 30
set -g status-right "#[fg=${TN_GREY}]%H:%M  %d %b "
set -g status-right-length 30

# Window tabs
#
# Four agent states. The bg-* pair means a Claude *background job* finished in
# that worktree — meldr can name the window but not the pane, since the job's
# host process has no pane of its own. Purple, and not blinking, so it reads as
# "something completed over there" rather than "the agent in front of you needs
# you".
TN_PURPLE="#bb9af7"
set -g window-status-format "#{?#{==:#{@cc_status},done},#[bg=#f7768e fg=${TN_BLACK} bold blink] #I:#W#F ,#{?#{==:#{@cc_status},waiting},#[bg=#e0af68 fg=${TN_BLACK} bold blink] #I:#W#F ,#{?#{==:#{@cc_status},bg-done},#[bg=${TN_PURPLE} fg=${TN_BLACK} bold] ⇣ #I:#W#F ,#{?#{==:#{@cc_status},bg-waiting},#[bg=${TN_BLUE} fg=${TN_BLACK} bold blink] ⇣ #I:#W#F ,#[fg=${TN_DARK} bg=${TN_BG}]#[fg=${TN_FG} bg=${TN_DARK}] #I:#W#F #[fg=${TN_DARK} bg=${TN_BG}] }}}}"
set -g window-status-current-format "#{?#{==:#{@cc_status},done},#[bg=#f7768e fg=${TN_BLACK} bold blink] #I:#W ,#{?#{==:#{@cc_status},waiting},#[bg=#e0af68 fg=${TN_BLACK} bold blink] #I:#W ,#{?#{==:#{@cc_status},bg-done},#[bg=${TN_PURPLE} fg=${TN_BLACK} bold] ⇣ #I:#W ,#{?#{==:#{@cc_status},bg-waiting},#[bg=${TN_BLUE} fg=${TN_BLACK} bold blink] ⇣ #I:#W ,#[fg=${TN_BLUE} bg=${TN_BG}]#[fg=#ffffff bg=${TN_BLUE} bold] #I:#W #[fg=${TN_BLUE} bg=${TN_BG}] }}}}"
set -g window-status-separator ""
# Bell style uses cyan (distinct from the red/orange agent flash) with no blink,
# so a build-script bell is visually different from an agent finishing.
set -g window-status-bell-style "bg=${TN_CYAN},fg=${TN_BLACK},bold"

# Pane borders
# Border status line shows @cc_pane_status when set (done=red, waiting=orange).
set -g pane-border-status top
set -g pane-border-format "#{?#{==:#{@cc_pane_status},done},#[bg=#f7768e fg=${TN_BLACK} bold] ● done ,#{?#{==:#{@cc_pane_status},waiting},#[bg=#e0af68 fg=${TN_BLACK} bold] ● waiting ,}}#[default fg=${TN_GREY}] #P "
set -g pane-border-style "fg=${TN_GREY}"
set -g pane-active-border-style "fg=${TN_BLUE}"

# Message & command line
set -g message-style "bg=${TN_DARK},fg=${TN_CYAN}"
set -g message-command-style "bg=${TN_DARK},fg=${TN_CYAN}"

# ---------------------------------------------------------------------------
# Plugins (TPM)
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'tmux-plugins/tmux-cowboy'
set -g @plugin 'sainnhe/tmux-fzf'

# Resurrect
set -g @resurrect-capture-pane-contents 'on'

# Continuum
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'

# Extrakto
set -g @extrakto_split_direction 'v'
set -g @extrakto_split_size '7'

# tmux-fzf
TMUX_FZF_LAUNCH_KEY="F"

# ---------------------------------------------------------------------------
# Initialize TPM (MUST be at end)
# ---------------------------------------------------------------------------
run '~/.tmux/plugins/tpm/tpm'

# ---------------------------------------------------------------------------
# Window naming (AFTER plugins to prevent overrides)
# ---------------------------------------------------------------------------
set -g allow-rename off
set -g automatic-rename off

# ---------------------------------------------------------------------------
# Local overrides (never committed)
# ---------------------------------------------------------------------------
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"
